<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD2 · 加载动效样例</title>
<style>
:root{color-scheme:light;--bg:oklch(97% .004 160);--panel:oklch(99% .003 160);--ink:oklch(25% .008 160);--muted:oklch(49% .008 160);--line:oklch(88% .006 160);--soft:oklch(93% .006 160);--accent:oklch(46% .11 162);--error:oklch(48% .17 25);--speed:2.4s;--shine:.32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:0}button,input,select{font:inherit}button,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 13px;cursor:pointer}button:hover:not(:disabled){background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:default}button.primary{background:var(--accent);color:oklch(99% .003 160);border-color:transparent}button.primary:hover:not(:disabled){filter:brightness(1.1)}[hidden]{display:none!important}
.shell{max-width:1180px;margin:auto;padding:0 32px}header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}h1{font-size:23px;line-height:1.2;margin:0;font-weight:650}h2{font-size:16px;margin:0;font-weight:620}p{margin:0}.brand{display:flex;align-items:center;gap:14px}.brand b{font-size:17px;color:var(--accent)}.meta{font-size:12px;color:var(--muted)}.controls{padding:22px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.control{display:flex;align-items:center;gap:8px}.control input[type=range]{width:110px;accent-color:var(--accent)}.control input[type=checkbox]{accent-color:var(--accent)}output{min-width:34px;font-variant-numeric:tabular-nums}.controls .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);column-gap:44px;padding-top:8px}.sample{padding:22px 0;border-bottom:1px solid var(--line);min-width:0}.sample-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}.sample-head>div{display:flex;align-items:center;gap:10px}.num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.state{font-size:12px;color:var(--muted);white-space:nowrap}.sample.wide{grid-column:1/-1}.shine{position:relative;overflow:hidden;isolation:isolate}.shine::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(100deg,transparent 18%,rgba(255,255,255,var(--shine)) 49%,transparent 80%);transform:translateX(-110%);animation:sweep var(--speed) linear infinite}.shine>*{position:relative;z-index:2}@keyframes sweep{0%{transform:translateX(-110%)}65%,100%{transform:translateX(110%)}}
.skeleton{background:var(--soft);border-radius:4px}.sk-text{height:11px;margin:10px 0;width:75%}.sk-text.short{width:43%}.list-row{display:grid;grid-template-columns:76px minmax(0,1fr) 62px;gap:14px;align-items:center;min-height:72px;padding:10px 0;border-top:1px solid var(--line)}.list-row:first-child{border-top:0}.thumb{width:76px;height:49px;border-radius:4px;object-fit:contain;background:var(--soft)}.row-copy{min-width:0}.row-copy strong{font-weight:550;display:block;font-size:13px;overflow-wrap:anywhere}.row-copy span{font-size:12px;color:var(--muted)}.row-state{font-size:12px;color:var(--muted);text-align:right}.skeleton-lines{width:100%}.skeleton-lines i{display:block}.refresh-line{height:3px;background:var(--soft);border-radius:2px;margin-bottom:5px}.refresh-line.shine::after{background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.65}.button-area{min-height:112px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.submit{height:40px;width:136px;display:flex;justify-content:center;align-items:center;gap:8px}.busy-mark{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;opacity:.75}.busy-mark::after{inset:-2px}.button-result{color:var(--muted);font-size:13px}.stage-track{display:flex;gap:6px;align-items:center;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.stage-track span{padding:4px 8px;border-radius:4px}.stage-track .active{color:var(--accent);background:var(--soft)}.video-node{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}.node-title{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:13px}.node-title b{font-weight:550}.viewport{aspect-ratio:16/9;background:oklch(23% .004 160);color:oklch(93% .005 160);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.viewport::after{background:linear-gradient(100deg,transparent 15%,rgba(210,235,224,calc(var(--shine)*.55)) 49%,transparent 80%)}.viewport .symbol{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(235,242,238,.3);border-radius:6px;font-size:18px}.viewport p{font-size:15px}.viewport .sub{font-size:12px;color:oklch(74% .009 160)}.result-img{width:100%;height:100%;object-fit:contain;position:absolute!important;inset:0}.result-label{position:absolute!important;bottom:10px;left:10px;background:oklch(23% .004 160);padding:3px 8px;border-radius:4px;font-size:11px}.node-foot{min-height:60px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.node-foot small{color:var(--muted)}.node-foot button{padding:6px 12px}.upload{padding:16px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.upload-name{overflow-wrap:anywhere}.upload small{color:var(--muted)}.progress{height:6px;background:var(--soft);border-radius:3px;grid-column:1/-1;overflow:hidden}.progress-fill{height:100%;background:var(--accent);width:42%;border-radius:3px}.progress-fill::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent)}.error{color:var(--error)!important}.success{color:var(--accent)!important}footer{padding:22px 0 28px;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted)}a{color:var(--accent)}
body[data-theme=dark]{color-scheme:dark;--bg:oklch(20% .004 160);--panel:oklch(24% .004 160);--ink:oklch(93% .004 160);--muted:oklch(70% .006 160);--line:oklch(35% .005 160);--soft:oklch(30% .006 160);--accent:oklch(75% .12 162);--error:oklch(74% .15 25)}body[data-theme=dark] button.primary{color:oklch(22% .009 160)}body.paused .shine::after{animation-play-state:paused}body.reduced .shine::after{animation:none;display:none}@media(prefers-reduced-motion:reduce){.shine::after{animation:none;display:none}}@media(max-width:700px){.shell{padding:0 18px}header{height:76px}h1{font-size:19px}.brand{gap:9px}.grid{grid-template-columns:minmax(0,1fr);gap:0}.sample.wide{grid-column:auto}.controls{gap:14px}.controls .actions{margin-left:0;width:100%}.sample{padding:20px 0}footer{flex-wrap:wrap}.meta{font-size:11px}}
.viewport{position:relative;overflow:hidden;isolation:isolate}
.sample.wide{grid-column:2;grid-row:2 / span 2}.grid>section:nth-child(4){grid-column:1;grid-row:3}
@media(max-width:700px){.sample.wide,.grid>section:nth-child(4){grid-column:auto;grid-row:auto}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><b>SD2</b><h1>加载动效样例</h1></div><span class="meta">独立样例 · v1.0.0</span></header>
<div class="controls" aria-label="样例设置">
<label class="control">主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
<label class="control">周期 <input id="speed" type="range" min="16" max="40" value="24"><output id="speed-value">2.4s</output></label>
<label class="control">亮度 <input id="strength" type="range" min="10" max="60" value="32"><output id="strength-value">32</output></label>
<label class="control"><input type="checkbox" id="reduce">减少动画</label>
<div class="actions"><button id="pause">暂停动画</button><button id="reset">重置</button><button id="replay" class="primary">重播样例</button></div>
</div>
<main class="grid">
<section class="sample" id="first-sample" aria-busy="true"><div class="sample-head"><div><span class="num">01</span><h2>首次加载</h2></div><span class="state" id="first-status" role="status">读取生成记录中</span></div><div id="first-list"></div></section>
<section class="sample" id="refresh-sample" aria-busy="true"><div class="sample-head"><div><span class="num">02</span><h2>刷新记录</h2></div><span class="state" id="refresh-status" role="status">更新中</span></div><div class="refresh-line shine" id="refresh-line" aria-hidden="true"></div><div id="refresh-list"></div></section>
<section class="sample"><div class="sample-head"><div><span class="num">03</span><h2>按钮提交</h2></div><span class="state">模拟提交</span></div><div class="button-area"><button class="submit primary" id="submit"><span>提交任务</span></button><span class="button-result" id="submit-status" role="status">等待提交</span></div></section>
<section class="sample"><div class="sample-head"><div><span class="num">04</span><h2>上传进度</h2></div><span class="state">模拟数据</span></div><div class="upload"><div class="upload-name">角色参考.png<br><small id="upload-status">模拟上传中</small></div><output id="upload-value">42%</output><div class="progress" id="upload-progress" role="progressbar" aria-label="模拟上传进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><div class="progress-fill shine" id="upload-fill"></div></div></div></section>
<section class="sample wide"><div class="sample-head"><div><span class="num">05</span><h2>视频生成</h2></div><div class="control"><label for="stage">模拟阶段</label><select id="stage"><option value="queued">排队中</option><option value="generating" selected>生成中</option><option value="preparing">文件准备中</option><option value="success">已完成</option><option value="failed">生成失败</option></select></div></div><div class="video-node"><div class="node-title"><b>雨定037 · 雨后街角</b><span id="node-status" role="status">生成中</span></div><div class="viewport shine" id="viewport" aria-busy="true"><div class="symbol" aria-hidden="true">✦</div><p id="stage-title">正在生成视频</p><p class="sub" id="stage-sub">等待生成结果</p><img class="result-img" id="result-img" src="../2026-10-02-canvas-plan-split/codex-clipboard-1f20d528-af7d-4e00-b5b5-e1d90892de90.png" alt="原画布参考样图，非生成视频" hidden><span class="result-label" id="result-label" hidden>预览样图 · 非生成视频</span></div><div class="node-foot"><small>模拟任务 · 15秒 / 16:9</small><div><button id="retry" hidden>重试样例</button><button id="complete">模拟完成</button><button id="preview" hidden>查看样图</button></div></div></div><div class="stage-track" aria-hidden="true"><span data-stage="queued">排队</span><span>›</span><span data-stage="generating" class="active">生成</span><span>›</span><span data-stage="preparing">文件准备</span><span>›</span><span data-stage="success">完成</span></div></section>
</main>
<footer><span>仅模拟界面状态，不发送任务、不产生费用</span><span id="motion-status">刷光开启</span><a href="https://mui.com/material-ui/react-skeleton/" target="_blank" rel="noreferrer">Wave 参考</a></footer>
</div>
<dialog id="preview-dialog" style="border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:90vw"><div style="display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:12px"><strong>原画布参考样图</strong><button id="close-preview">关闭</button></div><img src="../2026-10-02-canvas-plan-split/codex-clipboard-1f20d528-af7d-4e00-b5b5-e1d90892de90.png" alt="原画布截图" style="max-width:100%;max-height:70vh;display:block;margin:auto"></dialog>
<script>
const $ = id => document.getElementById(id);
const image = '../2026-10-02-canvas-plan-split/codex-clipboard-1f20d528-af7d-4e00-b5b5-e1d90892de90.png';
let timers = [], submitCount = 0;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const titles = ['雨后街角', '角色转身', '灯光试拍'];
function list(loading) {
  return titles.map((title, i) => loading ? `<div class="list-row" aria-hidden="true"><div class="thumb skeleton shine"></div><div class="skeleton-lines"><i class="sk-text skeleton shine"></i><i class="sk-text short skeleton shine"></i></div><div class="sk-text skeleton shine"></div></div>` : `<div class="list-row"><img class="thumb" src="${image}" alt="画布参考样图"><div class="row-copy"><strong>${title}</strong><span>画布参考 · 预览样图</span></div><span class="row-state">已完成</span></div>`).join('');
}
const stages = {queued:['排队中','任务已进入队列','等待开始生成'],generating:['生成中','正在生成视频','等待生成结果'],preparing:['文件准备中','生成已完成','正在准备可预览文件'],success:['已完成','样例已完成','预览样图，非真实生成结果'],failed:['生成失败','生成失败','模拟服务异常，输入已保留']};
function setStage(value){
  const terminal = value === 'success' || value === 'failed';
  $('stage').value=value; $('node-status').textContent=stages[value][0]; $('stage-title').textContent=stages[value][1]; $('stage-sub').textContent=stages[value][2];
  $('viewport').classList.toggle('shine',!terminal); $('viewport').setAttribute('aria-busy',String(!terminal));
  $('result-img').hidden=value!=='success'; $('result-label').hidden=value!=='success'; $('stage-title').hidden=value==='success'; $('stage-sub').hidden=value==='success'; $('viewport').querySelector('.symbol').hidden=value==='success';
  $('retry').hidden=value!=='failed'; $('complete').hidden=terminal; $('preview').hidden=value!=='success'; $('node-status').className=value==='failed'?'error':value==='success'?'success':'';
  document.querySelectorAll('[data-stage]').forEach(el=>el.classList.toggle('active',el.dataset.stage===value));
}
function settings(){
  document.body.dataset.theme=$('theme').value;
  document.documentElement.style.setProperty('--speed',`${$('speed').value/10}s`); $('speed-value').value=`${$('speed').value/10}s`;
  document.documentElement.style.setProperty('--shine',$('strength').value/100); $('strength-value').value=$('strength').value;
  document.body.classList.toggle('reduced',$('reduce').checked); updateMotion();
  try{localStorage.setItem('sd2-loading-study-v1',JSON.stringify({theme:$('theme').value,speed:$('speed').value,strength:$('strength').value,reduce:$('reduce').checked}));}catch{}
}
const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');
function updateMotion(){ $('motion-status').textContent=motionQuery.matches||$('reduce').checked?'减少动画已开启':document.body.classList.contains('paused')?'动画已暂停':'刷光开启'; }
motionQuery.addEventListener('change',updateMotion);
function replay(){
  timers.forEach(clearTimeout); timers=[]; submitCount=0; $('submit').disabled=false; $('submit').classList.remove('shine'); $('submit').innerHTML='<span>提交任务</span>'; $('submit-status').textContent='等待提交';
  $('first-list').innerHTML=list(true); $('refresh-list').innerHTML=list(false); $('first-status').textContent='读取生成记录中'; $('refresh-status').textContent='更新中'; $('refresh-line').classList.add('shine'); $('first-sample').setAttribute('aria-busy','true'); $('refresh-sample').setAttribute('aria-busy','true');
  $('upload-value').value='42%'; $('upload-fill').style.width='42%'; $('upload-fill').classList.add('shine'); $('upload-progress').setAttribute('aria-valuenow','42'); $('upload-status').textContent='模拟上传中'; setStage('generating');
}
$('submit').addEventListener('click',()=>{ if($('submit').disabled)return; submitCount++; $('submit').disabled=true; $('submit').classList.add('shine'); $('submit').innerHTML='<span class="busy-mark" aria-hidden="true"></span><span>提交中</span>'; $('submit-status').textContent='模拟提交中'; later(()=>{$('submit').classList.remove('shine'); $('submit').innerHTML='<span>已提交</span>'; $('submit-status').textContent='模拟任务已受理';},1600); });
$('stage').addEventListener('change',e=>setStage(e.target.value)); $('retry').onclick=()=>setStage('generating'); $('complete').onclick=()=>{setStage('success'); $('first-list').innerHTML=list(false); $('first-status').textContent='已加载'; $('refresh-status').textContent='已更新'; $('refresh-line').classList.remove('shine'); $('first-sample').setAttribute('aria-busy','false'); $('refresh-sample').setAttribute('aria-busy','false'); $('upload-value').value='100%'; $('upload-fill').style.width='100%'; $('upload-fill').classList.remove('shine'); $('upload-progress').setAttribute('aria-valuenow','100'); $('upload-status').textContent='模拟上传完成';};
$('pause').onclick=()=>{document.body.classList.toggle('paused'); $('pause').textContent=document.body.classList.contains('paused')?'继续动画':'暂停动画';updateMotion();};
$('replay').onclick=replay;
$('reset').onclick=()=>{$('theme').value='light';$('speed').value=24;$('strength').value=32;$('reduce').checked=false;document.body.classList.remove('paused');$('pause').textContent='暂停动画';settings();replay();};
['theme','speed','strength','reduce'].forEach(id=>$(id).addEventListener('input',settings));
try{const saved=JSON.parse(localStorage.getItem('sd2-loading-study-v1')||'null');if(saved){if(['light','dark'].includes(saved.theme))$('theme').value=saved.theme;if(Number(saved.speed)>=16&&Number(saved.speed)<=40)$('speed').value=saved.speed;if(Number(saved.strength)>=10&&Number(saved.strength)<=60)$('strength').value=saved.strength;$('reduce').checked=saved.reduce===true;}}catch{}
$('preview').onclick=()=>$('preview-dialog').showModal();$('close-preview').onclick=()=>$('preview-dialog').close();$('preview-dialog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();};
window.demo={setStage,replay,get submitCount(){return submitCount;}}; settings();replay();
</script>
</body>
</html>
