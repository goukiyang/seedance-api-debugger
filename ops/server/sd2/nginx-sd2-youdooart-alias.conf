server {
  listen 80;
  server_name sd2.youdooart.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://sd2.youdooart.com$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name sd2.youdooart.com;

  ssl_certificate /etc/letsencrypt/live/sd2.youdooart.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sd2.youdooart.com/privkey.pem;

  add_header X-SD2-Origin server-42-193 always;

  client_max_body_size 1024m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 30s;

  location / {
    proxy_pass http://127.0.0.1:3302;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
