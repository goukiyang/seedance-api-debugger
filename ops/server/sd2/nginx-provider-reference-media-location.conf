location = /api/provider/reference-media {
  access_log /data/video-api-debugger/logs/nginx-provider-reference-media.log sd2_provider_reference_media;
  error_log /dev/null;

  # Keep the release engine's single literal upstream and its nginx-UID
  # loopback forwarding contract intact during candidate/guard handoff.
  set $sd2_provider_reference_upstream http://127.0.0.1:3302;
  proxy_pass $sd2_provider_reference_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Connection "";
  proxy_buffering off;
}
