# Include inside each active SD2 server block. Application errors pass through.
proxy_intercept_errors off;
# Preserve the original HTTP status, including ambiguous API 502/504 submissions.
error_page 502 503 504 @sd2_updating;

location @sd2_updating {
  default_type application/json;
  charset utf-8;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "10" always;
  add_header X-SD2-Origin "server-42-193" always;
  add_header X-SD2-Status "updating-or-recovering" always;

  # The original error_page status is retained; these returns supply the JSON body.
  if ($request_method !~ "^(GET|HEAD)$") {
    return 503 '{"error":"服务正在更新或恢复，请稍后再试。","code":"SERVICE_TEMPORARILY_UNAVAILABLE"}';
  }
  if ($uri ~ "^/(api|_next)(/|$)") {
    return 503 '{"error":"服务正在更新或恢复，请稍后再试。","code":"SERVICE_TEMPORARILY_UNAVAILABLE"}';
  }
  if ($http_accept !~* "text/html") {
    return 503 '{"error":"服务正在更新或恢复，请稍后再试。","code":"SERVICE_TEMPORARILY_UNAVAILABLE"}';
  }

  root /data/video-api-debugger/site-status;
  try_files /updating.html =503;
}
