# Include only in the two SD2 server blocks. Originals and HD manifests stay private.
location ^~ /_protected_media/delivery/ {
    internal;
    alias /data/video-api-debugger/var-lib/storage/media-outlet/;
    disable_symlinks on;
    max_ranges 1;
    add_header Cache-Control $upstream_http_cache_control always;
    add_header X-Content-Type-Options nosniff always;
}
